name: Deploy to Tencent Lighthouse
on:
  push:
    branches: [main]
    paths: ['app/**', 'web/**', 'config/**', 'tests/**', 'requirements*.txt', 'Dockerfile', 'compose.yaml', 'scripts/deploy.sh', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-deployment
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg without unnecessary package refresh
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
          else
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests -q && node --check web/app.js && node --check web/input-rules.js && bash -n scripts/deploy.sh
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTHOUSE_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          SSH_USER: ${{ secrets.LIGHTHOUSE_USER }}
          SSH_PORT: ${{ secrets.LIGHTHOUSE_PORT }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$SSH_HOST" && -n "$SSH_USER" ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lighthouse
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lighthouse ~/.ssh/known_hosts
          printf '%s\n' 'Host lighthouse' "  HostName $SSH_HOST" "  User $SSH_USER" "  Port ${SSH_PORT:-22}" '  IdentityFile ~/.ssh/lighthouse' '  IdentitiesOnly yes' '  BatchMode yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 20' '  ServerAliveInterval 15' '  ServerAliveCountMax 6' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Verify server access and deployment lock
        run: |
          ssh lighthouse 'set -eu; docker version --format "{{.Server.Version}}"; test -f /opt/wardrobe-lab/shared/.env; flock -n /opt/wardrobe-lab/deploy.lock -c true || { echo "An earlier deployment still holds the server lock; inspect it before retrying."; exit 1; }'
      - name: Upload source only
        timeout-minutes: 5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          du -h "$archive"
          ssh lighthouse "mkdir -p /opt/wardrobe-lab/releases/$GITHUB_SHA"
          scp "$archive" "lighthouse:/opt/wardrobe-lab/releases/$GITHUB_SHA/"
          ssh lighthouse "cd /opt/wardrobe-lab/releases/$GITHUB_SHA && tar -xzf source.tar.gz"
      - name: Remove known failed uploads safely
        timeout-minutes: 2
        run: ssh lighthouse "cd /opt/wardrobe-lab/releases/$GITHUB_SHA && python3 scripts/cleanup-old-uploads.py"
      - name: Build with Tencent mirrors and deploy
        timeout-minutes: 17
        run: |
          set -euo pipefail
          ssh lighthouse "cd /opt/wardrobe-lab/releases/$GITHUB_SHA && bash -o pipefail -c 'timeout 15m bash scripts/deploy.sh $GITHUB_SHA 2>&1 | tee deploy.log'"
      - name: Verify public HTTP health
        env:
          SSH_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
        run: curl --fail --connect-timeout 10 --max-time 20 "http://$SSH_HOST/healthz"
      - name: Collect persistent deployment log on failure
        if: failure()
        continue-on-error: true
        run: |
          ssh lighthouse "df -h /opt/wardrobe-lab; test ! -f /opt/wardrobe-lab/releases/$GITHUB_SHA/deploy.log || tail -n 100 /opt/wardrobe-lab/releases/$GITHUB_SHA/deploy.log"
      - name: Remove temporary private key
        if: always()
        run: rm -f ~/.ssh/lighthouse ~/.ssh/config
