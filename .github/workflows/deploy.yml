name: Deploy to Tencent Lighthouse
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt && python -m pytest tests/test_backend.py -q
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTHOUSE_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          SSH_USER: ${{ secrets.LIGHTHOUSE_USER }}
          SSH_PORT: ${{ secrets.LIGHTHOUSE_PORT }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$SSH_HOST" && -n "$SSH_USER" ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lighthouse
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lighthouse ~/.ssh/known_hosts
          printf '%s\n' 'Host lighthouse' "  HostName $SSH_HOST" "  User $SSH_USER" "  Port ${SSH_PORT:-22}" '  IdentityFile ~/.ssh/lighthouse' '  IdentitiesOnly yes' '  BatchMode yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 20' '  ServerAliveInterval 15' '  ServerAliveCountMax 6' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Verify server access and deployment lock
        run: |
          ssh lighthouse 'set -eu; docker version --format "{{.Server.Version}}"; test -f /opt/wardrobe-lab/shared/.env; flock -n /opt/wardrobe-lab/deploy.lock -c true || { echo "An earlier deployment still holds the server lock; inspect it before retrying."; exit 1; }'
      - name: Build release images on GitHub
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker build --progress=plain -t "wardrobe-lab:$GITHUB_SHA" .
          docker pull caddy:2-alpine
          docker save "wardrobe-lab:$GITHUB_SHA" caddy:2-alpine | gzip -1 > "$RUNNER_TEMP/images.tar.gz"
          sha256sum "$RUNNER_TEMP/images.tar.gz"
      - name: Upload source and image bundle
        timeout-minutes: 25
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          ssh lighthouse "mkdir -p /opt/wardrobe-lab/releases/$GITHUB_SHA"
          echo "Uploading source archive"
          scp "$archive" "lighthouse:/opt/wardrobe-lab/releases/$GITHUB_SHA/"
          echo "Source upload completed; starting image transfer"
          bash scripts/upload-images.sh "$RUNNER_TEMP/images.tar.gz" "$GITHUB_SHA"
          digest=$(sha256sum "$RUNNER_TEMP/images.tar.gz" | cut -d ' ' -f 1)
          ssh lighthouse "cd /opt/wardrobe-lab/releases/$GITHUB_SHA && echo '$digest  images.tar.gz' | sha256sum -c - && tar -xzf source.tar.gz"
      - name: Load images and deploy without dependency downloads
        timeout-minutes: 12
        run: |
          set -euo pipefail
          ssh lighthouse "cd /opt/wardrobe-lab/releases/$GITHUB_SHA && bash -o pipefail -c 'timeout 10m bash scripts/deploy.sh $GITHUB_SHA --prebuilt 2>&1 | tee deploy.log'"
      - name: Collect persistent deployment log on failure
        if: failure()
        continue-on-error: true
        run: |
          ssh lighthouse "df -h /opt/wardrobe-lab; ls -lh /opt/wardrobe-lab/releases/$GITHUB_SHA/images.tar.gz 2>/dev/null || true; test ! -f /opt/wardrobe-lab/releases/$GITHUB_SHA/deploy.log || tail -n 100 /opt/wardrobe-lab/releases/$GITHUB_SHA/deploy.log"
      - name: Remove temporary private key
        if: always()
        run: rm -f ~/.ssh/lighthouse ~/.ssh/config
