name: Validate platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: node --check web/app.js && node --check web/input-rules.js && python -m compileall -q app
      - run: python -m pytest tests/test_backend.py tests/test_contracts.py tests/test_billing.py tests/test_frontend_rules.py -q
      - run: python -m unittest discover -s tests -p test_deployment.py
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/test_ui.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-checks
          path: test-results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wardrobe-lab:check .
